base_url = "https://blogfa.sohrabbehdani.ir/"

#rss
title = "محتوای آزاد سهراب"
description = "در اینجا از ایده هایم می‌گویم :)"
default_language = "fa"

generate_feeds = true
feed_filenames = ["rss.xml", "atom.xml"]

taxonomies = [
    {name = "tags"}
]

compile_sass = true
theme = "terminal"

minify_html = true

build_search_index = true

[markdown]
#generate_tags_pages = true
#generate_categories_pages = true

# GitHub-style alerts (callouts): > [!NOTE], > [!TIP], > [!WARNING], ...
github_alerts = true

# Syntax highlighting (giallo). Class-based styles so light/dark follow the
# auto color themes; the generated giallo-light.css / giallo-dark.css files
# are linked in templates/macros/head.html with matching media queries.
[markdown.highlighting]
error_on_missing_language = false
style = "class"
dark_theme = "catppuccin-mocha"
light_theme = "catppuccin-latte"

[link_checker]
# External links can be flaky in CI; warn instead of failing the build.
external_level = "warn"

[search]
include_title = true
include_description = true
include_content = true
include_path = true
index_format = "fuse_json"



[extra]
accent_color = "green"
comment = true
background_color = "green"
author = "سهراب بهدانی"
#copyright_html = "هستند &nbsp;<b>CC-BY-SA</b>  تمامی مطالب این وبگاه تحت اجازه‌نامه"

menu_items = [
    {name = "بلاگ", url = "$BASE_URL"},
    {name = "برچسب‌ها", url = "$BASE_URL/tags"},
    {name = "آرشیو‌ها", url = "$BASE_URL/archive"},
    {name = "جستجو", url = "$BASE_URL/search"},
    {name = "وبگاه من", url = "https://sohrabbehdani.ir", newtab = true},
    {name = "بلاگ انگلیسی", url = "https://blog.sohrabbehdani.ir/", newtab = true},
]

enable_post_view_navigation = true
#post_view_navigation_prompt = "بیشتر بخوانید..."

page_titles = "main_only"
logo_text = "مطالب سهراب"

[extra.footer]
since = 2023
license = "CC BY-SA 4.0"
license_url = "https://creativecommons.org/licenses/by-sa/4.0/deed"

[extra.mastodon]
host = "persadon.com"
username = "sohrab"
