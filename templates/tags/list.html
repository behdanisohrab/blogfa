{% extends "index.html" %}

{%- block title -%}
{{ title_macros::title(page_title="برچسب‌ها", main_title=config.title) }}
{%- endblock -%}

{% block content %}
    <div class="post post--single" style="--i: 1">
        <h1 class="post__title post__title--single">برچسب‌ها</h1>

        <ul class="tag__list">
            {% for term in terms %}
            <li>
                <a class="tag__item" dir="auto" href="{{ term.permalink | safe }}">#{{ term.name }}</a>
                <span class="tag__count">({{ term.pages | length }})</span>
            </li>
            {% endfor %}
        </ul>
    </div>
{% endblock content %}
