{% extends "index.html" %}

{%- block title -%}
{% set title = "Tag: " ~ term.name %}
{{ title_macros::title(page_title=title, main_title=config.title) }}
{%- endblock -%}

{% block content %}
    <div class="post post--single" style="--i: 1">
        <h1 class="post__title post__title--single" dir="auto">#{{ term.name }}</h1>

        <a class="tag__back" href="{{ config.base_url | trim_end_matches(pat='/') | safe }}/tags/">[همه برچسب‌ها]</a>

        {{ post_macros::list_posts(pages=term.pages) }}
    </div>
{% endblock content %}
